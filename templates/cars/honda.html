{% extends 'base.html' %}
{% block content %}

<!-- ================================================= -->
<!--                      HONDA                       -->
<!-- ================================================= -->

<section class="mb-5">

    <h2 class="section-title fw-bold mb-4">

        Honda

    </h2>


    <div class="row g-4">


        <div class="col-md-4">

            <div class="card car-card h-100 border-0 shadow-sm">

                <img
                        src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Honda-civic-sedan.jpg"
                        class="card-img-top"
                        alt="Honda Civic">


                <div class="card-body">

                    <h5 class="fw-bold">

                        Civic

                    </h5>

                    <p class="text-muted">

                        Один із найвідоміших
                        компактних автомобілів Honda.

                    </p>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card car-card h-100 border-0 shadow-sm">

                <img
                        src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Honda-CR-V.jpg"
                        class="card-img-top"
                        alt="Honda CR-V">


                <div class="card-body">

                    <h5 class="fw-bold">

                        CR-V

                    </h5>

                    <p class="text-muted">

                        Просторий кросовер
                        для сім'ї та подорожей.

                    </p>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card car-card h-100 border-0 shadow-sm">

                <img
                        src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Honda_Civic_Type_R.jpg"
                        class="card-img-top"
                        alt="Honda Civic Type R">


                <div class="card-body">

                    <h5 class="fw-bold">

                        Civic Type R

                    </h5>

                    <p class="text-muted">

                        Спортивна версія
                        Honda Civic.

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
