{% extends 'base.html' %}
{% block content %}

<!-- ================================================= -->
<!--                    TOYOTA                        -->
<!-- ================================================= -->

<section class="mb-5">

    <h2 class="section-title fw-bold mb-4">

        Toyota

    </h2>


    <div class="row g-4">


        <div class="col-md-4">

            <div class="card car-card h-100 border-0 shadow-sm">

                <img
                        src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Toyota_Camry.jpg"
                        class="card-img-top"
                        alt="Toyota Camry">


                <div class="card-body">

                    <h5 class="fw-bold">

                        Camry

                    </h5>

                    <p class="text-muted">

                        Комфортний седан
                        для щоденного використання.

                    </p>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card car-card h-100 border-0 shadow-sm">

                <img
                        src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Toyota_RAV_4.jpg"
                        class="card-img-top"
                        alt="Toyota RAV4">


                <div class="card-body">

                    <h5 class="fw-bold">

                        RAV4

                    </h5>

                    <p class="text-muted">

                        Популярний кросовер
                        для міста та подорожей.

                    </p>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card car-card h-100 border-0 shadow-sm">

                <img
                        src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Toyota_Prius.jpg"
                        class="card-img-top"
                        alt="Toyota Prius">


                <div class="card-body">

                    <h5 class="fw-bold">

                        Prius

                    </h5>

                    <p class="text-muted">

                        Відомий гібридний
                        автомобіль Toyota.

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
